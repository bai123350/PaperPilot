[project]
name = "paperpilot-api"
version = "0.1.0"
description = "Evidence-first biomedical research intelligence API"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=45,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.60,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=2.1,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "respx>=0.22,<1",
  "ruff>=0.8,<1"
]
pdf = ["pymupdf>=1.24,<2"]
cloud = ["oss2>=2.19,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
